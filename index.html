<!DOCTYPE html>

    <style>
        body { background-color: #030712; color: #f3f4f6; font-family: 'Inter', sans-serif; }
        .glass-nav { background: rgba(3, 7, 18, 0.7); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .text-glow { text-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }

<body class="antialiased selection:bg-blue-500 selection:text-white">

    <!-- Navigation -->
    <nav class="glass-nav fixed w-full top-0 z-50 transition-all duration-300">
        <div class="max-w-6xl mx-auto px-6 py-5 flex justify-between items-center">

            <div class="flex justify-center gap-4">
